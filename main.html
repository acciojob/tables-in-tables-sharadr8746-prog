<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nested HTML Tables</title>
    <style>
       table.outer-table, .outer-table th, .outer-table td {
            border: 2px solid black;
           
            padding: 10px;
        }
       
        table.inner-table, .inner-table th, .inner-table td {
            border: 1px solid black;
          
            padding: 6px 12px;
            text-align: center;
        }

        .black-cell {
            background-color: black;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

  
    <table class="outer-table">
        <tr>
            
            <td>
                <table class="inner-table">
                    <tr>
                        <th colspan="2">Nested Table 2</th>
                    </tr>
                    <tr>
                        <th>Column 1</th>
                        <th>Column 2</th>
                    </tr>
                    <tr>
                        <td>abc</td>
                        <td>def</td>
                    </tr>
                </table>
            </td>

            <td>
                <table class="inner-table">
                    <tr>
                        <th>Nested Table 1</th>
                    </tr>
                    <tr>
                        <td style="text-align: left;">
                            <ul>
                                <li>List item</li>
                                <li>List item</li>
                                <li>List item</li>
                            </ul>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
          
            <td>
                <table class="inner-table">
                    <tr>
                        <th colspan="2">Nested Table 3</th>
                    </tr>
                    <tr>
                        <td>Nested Table</td>
                        <td>Demo Continued</td>
                    </tr>
                </table>
            </td>

            <td>
                <table class="inner-table" style="width: 100%;">
                    <tr>
                        <th>Nested Table 4</th>
                    </tr>
                    <tr>
                        <td class="black-cell">HTML</td>
                    </tr>
                </table>
            </td>
        </tr>
    </tbody>
    </table>

</body>
</html>
